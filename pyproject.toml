[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "field-quarantine"
version = "0.1.0"
description = "Deterministic classification and safe migration of offline form submissions"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Field Quarantine contributors" }]
keywords = ["offline", "forms", "schema-migration", "reconciliation", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dnega-dev/FieldQuarantine"
Repository = "https://github.com/dnega-dev/FieldQuarantine"
Issues = "https://github.com/dnega-dev/FieldQuarantine/issues"
Changelog = "https://github.com/dnega-dev/FieldQuarantine/blob/main/CHANGELOG.md"

[project.scripts]
field-quarantine = "field_quarantine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
field_quarantine = ["py.typed"]
